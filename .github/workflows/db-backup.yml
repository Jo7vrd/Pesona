name: Backup Database

# Cadangkan database Postgres (Railway) otomatis tiap hari + bisa manual.
# Hasil dump disimpan sebagai artifact GitHub (retensi 30 hari), gratis.
#
# SETUP (sekali):
#   GitHub repo → Settings → Secrets and variables → Actions → New secret
#   Name: DATABASE_URL
#   Value: DATABASE_PUBLIC_URL dari Railway (yang mengandung proxy.rlwy.net)

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = ~01:00 WIT setiap hari
  workflow_dispatch: {} # tombol jalankan manual

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # pg_dump v18 (cocok dgn server Railway yg sudah di-upgrade ke PG 18)
      # dari repo resmi PostgreSQL/PGDG. Aturan: versi pg_dump harus >= versi
      # server. Dijalankan di runner Ubuntu langsung, bukan container Alpine,
      # agar actions/upload-artifact (butuh Node glibc) tetap berfungsi.
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL belum diset di repo."
            exit 1
          fi
          STAMP=$(date +%Y-%m-%d)
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" \
            --no-owner --no-privileges > "keikecil-$STAMP.sql"
          echo "BACKUP_FILE=keikecil-$STAMP.sql" >> "$GITHUB_ENV"
          ls -lh keikecil-*.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ github.run_number }}
          path: keikecil-*.sql
          retention-days: 30
